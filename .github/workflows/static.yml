# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["pocketbase-only-products"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bước mới: Thiết lập NodeJS để cài đặt thư viện và build React
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './e-commerce/package-lock.json'

      # Bước mới: Cài đặt thư viện và biên dịch (Build) React
      - name: Install and Build React App
        run: |
          cd e-commerce
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Đã sửa: Chỉ upload thư mục dist của e-commerce sau khi đã build thành công
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './e-commerce/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
